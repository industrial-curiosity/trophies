[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.35"
# OpenZeppelin uses MCOPY; support verified on all four EVM RPCs.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[fuzz]
runs = 256
